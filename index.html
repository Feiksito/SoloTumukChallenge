<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - SoloTumuk Challenge 2026</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background: radial-gradient(circle at center, #101520 0%, #020202 100%);
            font-family: 'Rajdhani', sans-serif;
            color: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .contenedor-principal {
            text-align: center;
            background: rgba(16, 25, 40, 0.8);
            padding: 2.5rem 2rem; /* Espaciado interno reducido */
            border-radius: 15px;
            border: 2px solid #00e5ff;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.2), inset 0 0 20px rgba(0, 229, 255, 0.1);
            max-width: 800px;
            width: 90%;
            position: relative;
            backdrop-filter: blur(5px);
            animation: aparecer 1s ease-out forwards;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Estilos para el logo del torneo */
        .logo-solotumuk {
            max-width: 120px; /* Tamaño del logo reducido */
            width: 100%;
            height: auto;
            border-radius: 15px;
            border: 3px solid #00e5ff;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.5);
            margin-bottom: 1rem; /* Margen reducido */
            animation: flotar 3s ease-in-out infinite;
            object-fit: cover;
        }

        @keyframes flotar {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); box-shadow: 0 0 30px rgba(0, 229, 255, 0.8); }
            100% { transform: translateY(0px); }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem; /* Fuente ligeramente más pequeña */
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(to right, #00e5ff, #7aff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: #b3d4ff;
            letter-spacing: 8px;
            margin-top: 0.5rem;
            margin-bottom: 1rem; /* Margen reducido */
            text-transform: uppercase;
        }

        .mensaje-agradecimiento {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            margin: 1rem 0;
            line-height: 1.4;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .mensaje-secundario {
            font-size: 1.1rem;
            color: #a1b0c6;
            margin-bottom: 2rem; /* Margen reducido */
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.5;
        }

        .divisor {
            height: 2px;
            background: linear-gradient(90deg, transparent, #00e5ff, transparent);
            margin: 1.5rem 0; /* Margen reducido */
            opacity: 0.5;
        }

        .boton-perfiles {
            display: inline-block;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            color: #050505;
            background-color: #7aff00;
            border: none;
            box-shadow: 0 0 20px rgba(122, 255, 0, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .boton-perfiles::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: all 0.5s ease;
            z-index: -1;
        }

        .boton-perfiles:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 0 30px rgba(122, 255, 0, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.8);
            background-color: #8aff1a;
        }

        .boton-perfiles:hover::before {
            left: 100%;
        }

        /* Partículas de fondo (puramente CSS) */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.4;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: #00e5ff;
            top: -100px;
            left: -100px;
            animation: pulse 6s infinite alternate;
        }

        .orb-2 {
            width: 250px;
            height: 250px;
            background: #7aff00;
            bottom: -50px;
            right: -50px;
            animation: pulse 8s infinite alternate-reverse;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.2); opacity: 0.6; }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            h2 { font-size: 1.1rem; letter-spacing: 4px; }
            .mensaje-agradecimiento { font-size: 1.3rem; }
            .contenedor-principal { padding: 2rem 1.5rem; }
            .logo-solotumuk { max-width: 100px; }
        }
    </style>
</head>
<body>

    <!-- Luces de fondo -->
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="contenedor-principal">
        <!-- Logo del torneo -->
        <img src="solotumuk.jpg" alt="Logo SoloTumuk Challenge" class="logo-solotumuk">
        
        <h1>SoloTumuk Challenge</h1>
        <h2>Edición 2026</h2>
        
        <div class="divisor"></div>
        
        <p class="mensaje-agradecimiento">
            ¡Gracias por participar en la edición 2026!
        </p>
        
        <p class="mensaje-secundario">
            El Nexo ha caído, las clasificaciones están cerradas y la historia ha sido escrita. Una temporada llena de tryhardeo, remontadas épicas y mucho LP. ¿Quién logró coronarse en la cima?
        </p>
        
        <a href="perfiles.html" class="boton-perfiles">Ver Perfiles Finales</a>
    </div>

</body>
</html>
